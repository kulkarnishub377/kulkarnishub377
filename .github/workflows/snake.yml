name: 🌟 Generate Light Contribution Snake

on:
  # ⏱️ Run automatically every 10 hours
  schedule:
    - cron: "0 */10 * * *"
  
  # 👆 Allow manual trigger from the Actions tab
  workflow_dispatch:
  
  # 🚀 Run on every push to the master branch
  push:
    branches:
    - master
    - main

# 🔒 Set permissions to allow writing to the repo
permissions:
  contents: write

# Opt-in to Node.js 24 to fix the action deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # 1️⃣ Checkout the repository
      - name: 📥 Checkout Repo
        uses: actions/checkout@v4

      # 2️⃣ Generate the Snake (3 Variations)
      - name: 🐍 Generate Snake Animation (Light Themes)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-light.svg?palette=github-light
            dist/github-contribution-grid-snake-ocean.svg?palette=ocean
            dist/github-contribution-grid-snake-interesting.svg?palette=github-light&color_snake=#FF5733&color_dots=#EBEDF0,#9BE9A8,#40C463,#30A14E,#216E39

      # 3️⃣ Push the results to the 'output' branch
      - name: 📤 Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
