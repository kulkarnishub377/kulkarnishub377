<svg width="900" height="280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="powerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="powerGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#powerBg)"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#00ffff" font-size="18"
        font-family="monospace" font-weight="bold" filter="url(#powerGlow)">
    ⚡ POWER LEVEL METER
  </text>

  <!-- Power meter arc background -->
  <path d="M 206.5685424949238 196.5685424949238 A 80 80 0 1 0 93.43145750507618 196.5685424949238" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="15" stroke-linecap="round"/>

  <!-- Power meter arc active -->
  <path d="M 199.03256429223813 76.78759900994478 A 80 80 0 0 0 93.43145750507618 196.5685424949238" fill="none" stroke="#00ffff" stroke-width="15" stroke-linecap="round" filter="url(#powerGlow)">
    <animate attributeName="stroke-opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- Power level display -->
  <text x="150" y="130" text-anchor="middle" fill="#00ffff" font-size="36"
        font-family="monospace" font-weight="bold" filter="url(#powerGlow)">
    64
  </text>
  <text x="150" y="155" text-anchor="middle" fill="#ffffff" font-size="12" font-family="monospace">
    POWER
  </text>
  <text x="150" y="175" text-anchor="middle" fill="#00ffff" font-size="14"
        font-family="monospace" font-weight="bold">
    Expert
  </text>

  <!-- Badges section header -->
  <text x="400" y="55" text-anchor="middle" fill="#00ffff" font-size="12" font-family="monospace">
    🏅 BADGES EARNED
  </text>

  <!-- Badges -->
  
      <g transform="translate(320, 80)">
        <rect x="-35" y="-15" width="70" height="35" rx="5" fill="rgba(255,255,255,0.1)" stroke="#00ffff" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" font-size="16">💯</text>
        <text x="0" y="20" text-anchor="middle" fill="#ffffff" font-size="7" font-family="monospace">Century Coder</text>
      </g>
      <g transform="translate(420, 80)">
        <rect x="-35" y="-15" width="70" height="35" rx="5" fill="rgba(255,255,255,0.1)" stroke="#00ffff" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" font-size="16">🎯</text>
        <text x="0" y="20" text-anchor="middle" fill="#ffffff" font-size="7" font-family="monospace">Commit Master</text>
      </g>
      <g transform="translate(520, 80)">
        <rect x="-35" y="-15" width="70" height="35" rx="5" fill="rgba(255,255,255,0.1)" stroke="#00ffff" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" font-size="16">⚔️</text>
        <text x="0" y="20" text-anchor="middle" fill="#ffffff" font-size="7" font-family="monospace">Code Warrior</text>
      </g>
      <g transform="translate(320, 130)">
        <rect x="-35" y="-15" width="70" height="35" rx="5" fill="rgba(255,255,255,0.1)" stroke="#00ffff" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" font-size="16">📅</text>
        <text x="0" y="20" text-anchor="middle" fill="#ffffff" font-size="7" font-family="monospace">Weekly Warrior</text>
      </g>
      <g transform="translate(420, 130)">
        <rect x="-35" y="-15" width="70" height="35" rx="5" fill="rgba(255,255,255,0.1)" stroke="#00ffff" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" font-size="16">🌙</text>
        <text x="0" y="20" text-anchor="middle" fill="#ffffff" font-size="7" font-family="monospace">Monthly Legend</text>
      </g>
      <g transform="translate(520, 130)">
        <rect x="-35" y="-15" width="70" height="35" rx="5" fill="rgba(255,255,255,0.1)" stroke="#00ffff" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" font-size="16">🔥</text>
        <text x="0" y="20" text-anchor="middle" fill="#ffffff" font-size="7" font-family="monospace">Streak Champion</text>
      </g>

  <!-- Level display -->
  
    <g transform="translate(700, 80)">
      <rect x="-60" y="-30" width="150" height="80" rx="10" fill="rgba(0,0,0,0.5)" stroke="#00ffff" stroke-width="2"/>
      <text x="15" y="-5" text-anchor="middle" fill="#00ffff" font-size="28" font-family="monospace" font-weight="bold">
        LV.5
      </text>
      <text x="15" y="20" text-anchor="middle" fill="#ffffff" font-size="10" font-family="monospace">
        Full Stack Hero
      </text>
      <rect x="-45" y="30" width="120" height="10" rx="5" fill="rgba(255,255,255,0.2)"/>
      <rect x="-45" y="30" width="120" height="10" rx="5" fill="#00ffff">
        <animate attributeName="width" values="110.00000000000001;120;110.00000000000001" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="15" y="55" text-anchor="middle" fill="#ffffff" font-size="8" font-family="monospace">
        XP: 100%
      </text>
    </g>

  <!-- Stats panel -->
  
    <g transform="translate(50, 230)">
      <rect x="0" y="0" width="800" height="40" rx="8" fill="rgba(0,0,0,0.4)" stroke="#00ffff" stroke-width="1"/>
      <text x="30" y="25" fill="#ffffff" font-size="11" font-family="monospace">
        📊 1351 commits
      </text>
      <text x="200" y="25" fill="#ffffff" font-size="11" font-family="monospace">
        🔥 71 day streak
      </text>
      <text x="370" y="25" fill="#ffffff" font-size="11" font-family="monospace">
        🏆 71 max streak
      </text>
      <text x="540" y="25" fill="#ffffff" font-size="11" font-family="monospace">
        📈 35 this week
      </text>
      <text x="700" y="25" fill="#ffd700" font-size="11" font-family="monospace">
        🚀 ELITE MODE
      </text>
    </g>

</svg>